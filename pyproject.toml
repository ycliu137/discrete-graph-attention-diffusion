[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dgad"
version = "0.1.0"
description = "Discrete Graph Attention Diffusion for general graph learning"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dgad*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
